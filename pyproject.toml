[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceclone-studio"
version = "1.0.0"
description = "Local, offline desktop application for zero-shot voice cloning and text-to-speech."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "VoiceClone Studio Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "PySide6>=6.7.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "pydub>=0.25.1",
    "noisereduce>=3.0.0",
    "pyloudnorm>=0.1.1",
    "platformdirs>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.5.0",
]

[project.scripts]
voiceclone = "voiceclone.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voiceclone*"]

