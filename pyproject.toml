[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceclone-studio"
version = "1.0.0"
description = "Local, offline desktop application for zero-shot voice cloning and text-to-speech."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "VoiceClone Studio Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.1",
    "noisereduce>=3.0.0",
    "pyloudnorm>=0.1.1",
    "platformdirs>=4.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "websockets>=17.4",
    "setuptools<81",  # perth (Chatterbox watermark) imports pkg_resources, removed in 81
  ]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.5.0",
    "ruff>=0.17.0",
    "mypy>=1.11.0",
    "vulture>=2.14",
  ]

[project.scripts]
voiceclone-api = "app.api.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["voiceclone*", "app*"]

# ---------------------------------------------------------------------------
# Ruff - linting + import hygiene
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RET", # flake8-return
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI Depends()/Body() in defaults is idiomatic
    "SIM105",  # contextlib.suppress is not always clearer
    "RET504",  # named return values aid readability in service code
]

[tool.ruff.lint.per-file-ignores]
# Route modules intentionally re-export names for backwards compatibility.
"app/api/server.py" = ["E402", "F401"]
# Tests may use private helpers and assert loosely on purpose.
"tests/*" = ["B011", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# mypy - static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["app"]
mypy_path = "typings"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = false

# ---------------------------------------------------------------------------
# vulture - dead code detection
# ---------------------------------------------------------------------------
[tool.vulture]
min_confidence = 80
paths = ["app", "tests"]
# Every name below is part of a public signature and must not be removed:
#   *_                - private/protected convention
#   to_dict/from_dict - serialisation protocol
#   main/run          - entry points
#   args/time_info    - PortAudio callback + Qt signal signatures
#   min_chars_per_chunk / min_silence_duration_ms
#   source_audio_path / target_reference_path
#                       - public parameters of overridable engine/audio methods
ignore_names = [
    "_*",
    "to_dict",
    "from_dict",
    "main",
    "run",
    "args",
    "time_info",
    "min_chars_per_chunk",
    "min_silence_duration_ms",
    "source_audio_path",
    "target_reference_path",
    "a",
]
